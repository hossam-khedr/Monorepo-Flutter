name: login
description: "A new Flutter package project."
version: 0.0.1


environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  dartz:
  theme:
    path: ../../packages/theme
  core:
    path: ../../packages/core/
  data:
    path: ../../packages/data/
  shared_ui:
    path: ../../packages/shared_ui/
